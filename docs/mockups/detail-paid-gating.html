@font-face { font-family: 'App'; src: url('../../assets/font.ttf'); }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { background:#0c0c0c; color:#9a9a9a; font-family:'App',sans-serif; padding:32px; }
h1 { font-size:22px; font-weight:400; color:#d0d0d0; margin-bottom:6px; }
p.lede { font-size:14px; line-height:1.5; max-width:78ch; margin-bottom:28px; }

.panels { display:flex; flex-wrap:wrap; gap:28px; align-items:flex-start; }
figure { display:flex; flex-direction:column; gap:8px; }
figcaption { font-size:13px; color:#8a8a8a; max-width:60ch; }
table.spec { border-collapse:collapse; font-size:13px; margin:8px 0 4px; }

table.spec th { color:#c0c0c0; }

.screen { position:relative; overflow:hidden; width:var(--w); height:var(--h); background:var(--bg);

.hdr { position:absolute; left:0; right:0; top:0; height:var(--hdr); background:var(--surface);
  border-bottom:2px solid var(--accent); display:flex; align-items:center; padding:0 var(--pad); }
.hdr-t { font-size:var(--mf); color:var(--main); }
.hdr.two { height:var(--hdr2); flex-direction:column; align-items:flex-start; justify-content:center; gap:calc(var(--sf)*.15); }
.dt { font-size:var(--mf); line-height:1.1; }
.db { font-size:var(--sf); color:var(--hint); }
.sys { position:absolute; right:calc(var(--pad)*.5); top:calc(var(--hdr2)*.34); font-size:var(--sf);
  background:var(--chip); color:var(--main); border-radius:999px; padding:0 .5em; }
.ftr { position:absolute; left:0; right:0; bottom:0; height:var(--ftr); background:var(--surface);
  display:flex; align-items:center; gap:.35em; padding:0 calc(var(--pad)*.5); font-size:var(--sf); }
.hk { background:var(--accent); color:var(--accent-t); display:inline-flex; align-items:center; justify-content:center;

.hk.circle { width:1.5em; border-radius:50%; }
.hk.pill { padding:0 .35em; border-radius:999px; }
.ht { color:var(--hint); margin-right:.6em; }

.qr-card { position:absolute; line-height:0; }
.qr-card.small { outline:none; }
.qr { display:block; }
.theme-light .qr-card { box-shadow:0 0 0 1px var(--chip); }

.si-col { position:absolute; display:flex; flex-direction:column; }
.si-lead { font-size:var(--mf); line-height:1.25; color:var(--main); }
.si-note { font-size:var(--sf); color:var(--hint); margin-top:calc(var(--mf)*1.1); }
.si-code { font-weight:700; letter-spacing:.06em; line-height:1.1; color:var(--main);

.si-timer { display:flex; align-items:center; gap:.6em; font-size:var(--sf); color:var(--hint); margin-top:calc(var(--sf)*.7); }
.si-timer .bar { flex:0 0 38%; height:max(3px,calc(var(--sf)*.2)); background:var(--chip); border-radius:999px; overflow:hidden; }
.si-timer .fill { height:100%; background:var(--hint); }
.theme-light .si-timer .fill { background:var(--accent); }
.si-url { margin-top:auto; display:flex; flex-direction:column; gap:.2em; font-size:var(--sf); color:var(--hint); }
.si-url .u { color:var(--muted); word-break:break-all; }
.si-col.stacked { align-items:center; text-align:center; }
.si-col.stacked .si-note { margin-top:0; }
.si-col.stacked .si-timer { justify-content:center; width:100%; }

.msg { position:absolute; left:10%; right:10%; top:var(--hdr); bottom:var(--ftr); display:flex; flex-direction:column;
  justify-content:center; gap:calc(var(--mf)*.55); }
.msg-t { font-size:calc(var(--mf)*1.25); }

.scrim { position:absolute; inset:0; background:var(--scrim); }
.modal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--modal);

.modal-t { font-size:var(--mf); text-align:center; color:var(--main); padding-bottom:calc(var(--mf)*.45); }

.modal-h { display:flex; justify-content:center; align-items:center; gap:.35em; font-size:var(--sf); padding-top:calc(var(--mf)*.45); }
.rule { height:1px; background:var(--chip); }

.row { position:absolute; left:4px; right:4px; display:flex; align-items:center; padding:0 calc(var(--pad) - 4px);

.row.sel { background:var(--accent); color:var(--accent-t); }
.row .muted { color:var(--muted); } .row.sel .muted { color:var(--hint); }
.row .ok { color:var(--list-t); } .row.sel .ok { color:var(--accent-t); }

.qr-cap { position:absolute; text-align:center; font-size:var(--sf); color:var(--muted); line-height:1.3; }
.imgn { position:absolute; font-size:var(--mf); color:var(--muted); }
